[sandbox]
scratch_dir = true            # go test, mise run, node-gyp
allow_cache_exec = ["ms-playwright"]
yes = true
deny_clipboard = false
brief = true
keychain_substitute = true

[allow]
read = ["~/Desktop"]
# Shared pnpm store; needs pnpm store-dir set.
write = ["~/Library/pnpm/store"]

[proxy]
allow_private_domains = ["intern.nav.no", "mimir.nav.cloud.nais.io", "loki.nav.cloud.nais.io", "tempo.dev-gcp.nav.cloud.nais.io", "tempo.prod-gcp.nav.cloud.nais.io"]

[gh_guard]
enabled = true

[git_guard]
enabled = true
protect_default_branch_only = true
