[env]
DOCKER_HOST = "unix://{{env.HOME}}/.colima/default/docker.sock"
PNPM_HOME = "{{env.HOME}}/Library/pnpm"
NODE_OPTIONS = "--no-deprecation"
FZF_DEFAULT_COMMAND = 'fd --hidden --exclude .git'
KUBECONFIG = "{{env.HOME}}/.kube/config"
KUBE_EDITOR = "nvim"
GOPATH = "{{env.HOME}}/go"
_.path = ["{{env.HOME}}/Library/pnpm"]

[tools]
"aqua:bitwarden/clients" = "latest"
fnox = "latest"
gcloud = "latest"
go = "1.26"
opentofu = "latest"
pnpm = "latest"
rust = "latest"
uv = "latest"
"go:github.com/sethvargo/ratchet" = "latest"
watchexec = "latest"
node = "24"
actionlint = "latest"
bat = "latest"
delta = "latest"
difftastic = "latest"
fd = "latest"
fzf = "latest"
gitleaks = "latest"
jq = "latest"
lefthook = "latest"
yq = "latest"
kubectx = "latest"
kubectl = "1.32"
helm = "3"
kustomize = "5"
kubebuilder = "4"
python = "3.11"
"npm:@caveman-ai/cli" = "1"
gradle = "8"
kubecolor = "latest"
shellcheck = "latest"
"npm:vercel" = "latest"

[settings]
idiomatic_version_file_enable_tools = []
npm.shell_out = true

[tasks.bootstrap]
description = "Bootstrap a fresh macOS machine from this dotfiles repo"

[tasks.cleanup]
description = "Clear regenerable caches (docker, pnpm, brew, go, etc)"

[tasks.transfer]
description = "Securely migrate workspaces and secrets from an old Mac"

[tasks.update]
description = "Update system packages, runtimes, and plugins"

[tasks."claude:apply"]
description = "Bring maskinen til den sporede Claude Code-konfigurasjonen"
run = "python3 {{env.HOME}}/.config/claude/manage.py apply"

[tasks."claude:check"]
description = "Rapporter avvik mellom maskinen og den sporede konfigurasjonen"
run = "python3 {{env.HOME}}/.config/claude/manage.py check"

[tasks."claude:capture"]
description = "Frys maskinens nåværende Claude Code-innstillinger ned i repoet"
run = "python3 {{env.HOME}}/.config/claude/manage.py capture"

[tasks."claude:test"]
description = "Selvtest for manage.py og hookene i .config/claude/hooks/"
run = [
  "python3 {{env.HOME}}/.config/claude/manage.py --selftest",
  "rc=0; for h in {{env.HOME}}/.config/claude/hooks/*.py; do python3 \"$h\" --selftest || rc=1; done; exit $rc",
]
